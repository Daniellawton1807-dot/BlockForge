<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16121c" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Films &amp; Shows</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="mum.css?v=2">
</head>
<body>
<main id="app">
  <header class="top">
    <h1>What would you like to watch?</h1>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="search" placeholder="Search for a film or show" autocomplete="off" autocorrect="off" enterkeyhint="search" maxlength="80" aria-label="Search for a film or show">
      <button id="clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
    </label>
  </header>
  <div id="content"></div>
</main>

<section id="setup" class="setup" hidden>
  <div class="setup-card">
    <img src="icon-192.png" alt="" width="72" height="72">
    <h1>Films &amp; Shows</h1>
    <p>Daniel needs to set up this phone once. After that it stays ready to use.</p>
    <form id="setupForm" autocomplete="off">
      <input id="su" type="text" placeholder="Username" autocapitalize="none" autocomplete="username" required>
      <input id="sp" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Set up this phone</button>
      <p id="setupMsg" class="msg" aria-live="polite"></p>
    </form>
  </div>
</section>

<div id="sheet" class="sheet" hidden><div class="scrim"></div><div class="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="mum.js?v=2"></script>
</body>
</html>
