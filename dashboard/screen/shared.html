<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared Home</title>
<style>
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html,body{height:100%;width:100%;overflow:hidden;background:#07071a;color:#fff;font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif}
  /* ---- home screen (same look as the MinePad home) ---- */
  #home{position:fixed;inset:0}
  .wall{position:absolute;inset:0;background:radial-gradient(120% 90% at 20% 10%,#2b59ff 0%,transparent 55%),radial-gradient(100% 80% at 90% 20%,#a23bff 0%,transparent 55%),radial-gradient(110% 90% at 60% 100%,#ff4f8b 0%,transparent 60%),#0d0f2e}
  .status{position:absolute;top:0;left:0;right:0;height:6.5vmin;padding:0 4vmin;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:2.6vmin;text-shadow:0 1px 6px #0006}
  .widget{position:absolute;top:9vmin;left:5vmin;text-shadow:0 2px 14px #0007}
  .widget .t{font-size:13vmin;font-weight:700;letter-spacing:-.02em;line-height:1}.widget .d{font-size:3.4vmin;font-weight:500;opacity:.9;margin-top:1vmin}
  .pill{position:absolute;padding:1.4vmin 3vmin;border-radius:99px;background:#ffffff30;backdrop-filter:blur(2vmin);font-size:2.6vmin;font-weight:600;cursor:pointer;border:1px solid #ffffff40}
  .pill:hover{background:#ffffff55}
  #edit{top:9vmin;right:5vmin}
  .grid{position:absolute;left:5vmin;right:5vmin;top:34vmin;bottom:9vmin;overflow:hidden;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:min-content;gap:4vmin 2vmin;justify-items:center;align-content:start}
  .app{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.1vmin;cursor:pointer;width:17vmin;transition:transform .15s}
  .app:active{transform:scale(.9)}
  .ico{width:15vmin;height:15vmin;border-radius:3.6vmin;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1vmin 3vmin #0005;transition:transform .15s,box-shadow .15s;font-size:7vmin;font-weight:700;background:#fff}
  .ico img{width:62%;height:62%;object-fit:contain}
  .app:hover .ico{transform:scale(1.07);box-shadow:0 1.4vmin 4vmin #0008,0 0 0 .5vmin #ffffffb0}
  .lbl{font-size:2.4vmin;font-weight:500;text-shadow:0 1px 5px #0008;max-width:17vmin;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .x{display:none;position:absolute;top:-1.2vmin;left:0;width:4.4vmin;height:4.4vmin;border-radius:50%;background:#e5e5eacc;color:#222;font-size:3.4vmin;line-height:4.4vmin;text-align:center;font-weight:700;z-index:2}
  body.editing .x{display:block}
  body.editing .app{animation:wiggle .3s ease-in-out infinite alternate}
  @keyframes wiggle{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
  .hint{position:absolute;left:0;right:0;bottom:3vmin;text-align:center;font-size:2.3vmin;opacity:.75;text-shadow:0 1px 5px #0008}
  /* ---- app view ---- */
  #stage{position:fixed;inset:0;background:#000}
  canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none;outline:none;cursor:default}
  #__wdbar{display:none!important}   /* the MinePad injects its own pill; this page draws the same one, wired to the shared home */
  #ask{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);width:min(80vw,900px);padding:10px;border-radius:99px;background:#1c1c1ee6;backdrop-filter:blur(14px);box-shadow:0 4px 18px #000a;z-index:7}
  #ask input{width:100%;height:46px;border:0;border-radius:99px;padding:0 22px;background:#ffffff22;color:#fff;font:600 18px system-ui,sans-serif;outline:none;-webkit-user-select:text;user-select:text}
  #toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);padding:10px 20px;border-radius:99px;background:#000c;color:#fff;font:600 16px system-ui,sans-serif;z-index:8}
  #msg{position:fixed;inset:0;display:grid;place-items:center;color:#c9cfdd;pointer-events:none;text-align:center;padding:20px;font-size:3vmin;z-index:6;background:#000a}
  #loading{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;color:#fffa;font-size:3vmin;z-index:2}
  .cur{position:fixed;width:2.2vmin;height:2.2vmin;min-width:12px;min-height:12px;margin:-1.1vmin 0 0 -1.1vmin;border-radius:50%;border:2px solid #fff;background:#ffffff33;pointer-events:none;z-index:5;transition:left .06s linear,top .06s linear}
  .cur b{position:absolute;left:100%;top:60%;font:600 max(1.8vmin,11px) system-ui;background:#000b;color:#fff;border-radius:6px;padding:1px 6px;white-space:nowrap}
</style></head><body>
<div id="home">
  <div class="wall"></div>
  <div class="status"><span id="clock"></span><span id="who2"></span></div>
  <div class="widget"><div class="t" id="big"></div><div class="d" id="date"></div></div>
  <div class="pill" id="edit">Edit</div>
  <div class="grid" id="grid"></div>
  <div class="hint">Tap an app. Everyone on this screen sees the same thing.</div>
</div>
<div id="stage" hidden><canvas id="c" tabindex="0"></canvas><div id="loading">Opening…</div></div>
<div id="wrap" hidden><div id="pill"></div></div>
<div id="ask" hidden><input id="url" placeholder="Search or type an address, then Enter" autocomplete="off" spellcheck="false"></div>
<div id="toast" hidden></div>
<div id="msg">Connecting…</div>
<script>
/* One browser on the home server, one home screen, shared by everyone on the same ?room=. Tapping an app opens it for everybody; the home
   button brings everybody back. Address: shared.html?room=cinema&k=KEY[&n=Name][&host=wss://…][&w=…&h=…] (key from ~/sharedbrowser/config.json) */
(() => {
  const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), cv = $("c"), g = cv.getContext("2d"), msg = $("msg"), url = $("url"), grid = $("grid");
  const me = (() => { try { let i = localStorage.getItem("wd.sb"); if (!i) localStorage.setItem("wd.sb", i = Math.random().toString(36).slice(2, 10)); return i; } catch { return Math.random().toString(36).slice(2, 10); } })();
  try { localStorage.setItem("wd.sbhome", location.href); } catch {}   // the Screen Player's Home link comes back here
  const host = q.get("host") || (/(^|\.)danielvault\.uk$/.test(location.hostname) ? "wss://browser.danielvault.uk" : (location.protocol === "https:" ? "wss://" : "ws://") + location.host);
  let ws, retry = 0, meta = {}, st = { view: "home", pins: [] }, buttons = 0, away, sized = false;
  const cursors = new Map(), send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  /* ---- connection ---- */
  function connect() {
    const p = new URLSearchParams({ room: q.get("room") || "main", k: q.get("k") || "", id: me, n: q.get("n") || "" });
    ws = new WebSocket(host + "/ws?" + p); ws.binaryType = "arraybuffer";
    ws.onopen = () => { retry = 0; msg.hidden = true; sized = false; fit(); };
    ws.onmessage = e => {
      if (typeof e.data !== "string") { const u8 = new Uint8Array(e.data); if (u8[0] === 1) audioIn(u8); else frame(e.data); return; }
      const m = JSON.parse(e.data);
      if (m.t === "meta") { meta = m; $("who2").textContent = m.n > 1 ? m.n + " watching" : ""; paintPill(); }
      else if (m.t === "state") { st = m; view(); }
      else if (m.t === "cur") dot(m);
      else if (m.t === "gone") { const d = cursors.get(m.id); if (d) { d.remove(); cursors.delete(m.id); } }
      else if (m.t === "err") { msg.hidden = false; msg.textContent = "Browser error: " + m.msg; }
    };
    ws.onclose = () => { msg.hidden = false; msg.textContent = "Reconnecting…"; setTimeout(connect, Math.min(8000, 800 * ++retry)); };
  }
  /* Ask for a picture that suits this window (about one megapixel at most), unless the address fixes a size. */
  function fit() {
    if (sized) return; sized = true; let w = +q.get("w"), h = +q.get("h");
    if (!w) { w = innerWidth; h = innerHeight; const k = Math.min(1, Math.sqrt(1e6 / (w * h))); w = Math.max(320, Math.round(w * k / 2) * 2); h = Math.max(240, Math.round(h * k / 2) * 2); }
    send({ t: "size", w, h });
  }

  /* ---- drawing: always the newest frame, never a backlog ---- */
  let latest = null, decoding = false;
  async function frame(buf) {
    latest = buf; if (decoding) return; decoding = true;
    while (latest) { const b = latest; latest = null; try { const bm = await createImageBitmap(new Blob([b], { type: "image/jpeg" })); if (cv.width !== bm.width || cv.height !== bm.height) { cv.width = bm.width; cv.height = bm.height; } g.drawImage(bm, 0, 0); bm.close(); $("loading").hidden = true; } catch {} }
    decoding = false;
  }

  /* ---- home screen ---- */
  const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 0), hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
  function tiles() {
    grid.replaceChildren(...st.pins.map(p => {
      const a = document.createElement("div"); a.className = "app";
      const ico = document.createElement("span"); ico.className = "ico";
      const img = document.createElement("img"); img.src = "https://www.google.com/s2/favicons?sz=128&domain=" + encodeURIComponent(hostOf(p.u));
      img.onerror = () => { img.remove(); ico.style.background = `hsl(${hue(hostOf(p.u))},60%,45%)`; ico.style.color = "#fff"; ico.textContent = (p.t || "?").charAt(0).toUpperCase(); }; ico.append(img);
      const x = document.createElement("span"); x.className = "x"; x.textContent = "×"; x.onclick = e => { e.stopPropagation(); send({ t: "unpin", u: p.u }); };
      const l = document.createElement("span"); l.className = "lbl"; l.textContent = p.t; a.append(x, ico, l);
      a.onclick = () => { if (document.body.classList.contains("editing")) return; if (p.local) location.href = p.u; else send({ t: "open", u: p.u }); };
      return a;
    }));
  }
  $("edit").onclick = () => { const on = document.body.classList.toggle("editing"); $("edit").textContent = on ? "Done" : "Edit"; };
  const tick = () => { const n = new Date(), t = n.getHours() + ":" + ("0" + n.getMinutes()).slice(-2); $("clock").textContent = $("big").textContent = t; $("date").textContent = n.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }); };
  tick(); setInterval(tick, 5000);
  function view() {
    const app = st.view === "app"; $("home").hidden = app; $("stage").hidden = !app; $("wrap").hidden = !app; if (!app) { collapse(); closeAsk(); }
    if (app) { $("loading").hidden = !!latest; cv.focus(); } else { document.body.classList.remove("editing"); $("edit").textContent = "Edit"; tiles(); $("loading").hidden = false; latest = null; }
    document.title = app ? (meta.title || "Shared Browser") : "Shared Home";
  }

  /* ---- cursors ---- */
  const picture = () => { const r = cv.getBoundingClientRect(), k = Math.min(r.width / (cv.width || 1), r.height / (cv.height || 1)), w = (cv.width || 1) * k, h = (cv.height || 1) * k; return { left: r.left + (r.width - w) / 2, top: r.top + (r.height - h) / 2, width: w, height: h }; };
  const area = () => st.view === "app" ? picture() : { left: 0, top: 0, width: innerWidth, height: innerHeight };
  function dot(m) {
    let d = cursors.get(m.id); if (!d) { d = document.createElement("div"); d.className = "cur"; d.style.borderColor = `hsl(${hue(m.id)} 90% 65%)`; const b = document.createElement("b"); b.textContent = m.n || ""; b.hidden = !m.n; d.append(b); document.body.append(d); cursors.set(m.id, d); }
    const r = area(); d.style.left = r.left + m.x * r.width + "px"; d.style.top = r.top + m.y * r.height + "px"; d.hidden = false; clearTimeout(d.t); d.t = setTimeout(() => { d.hidden = true; }, 4000);
  }
  let lastCur = 0;
  addEventListener("pointermove", e => {
    const t = performance.now(); if (t - lastCur < 40) return; lastCur = t;
    const r = area(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height; send({ t: "cur", x, y });
    if (st.view === "app" && e.target === cv) send({ t: "mv", x, y, bs: buttons });
  });

  /* ---- driving the browser ---- */
  const pos = e => { const r = picture(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
  cv.addEventListener("pointerdown", e => { cv.focus(); buttons |= 1 << (e.button | 0); cv.setPointerCapture(e.pointerId); send({ t: "dn", ...pos(e), b: e.button, n: e.detail || 1 }); e.preventDefault(); });
  cv.addEventListener("pointerup", e => { buttons &= ~(1 << (e.button | 0)); send({ t: "up", ...pos(e), b: e.button, n: e.detail || 1 }); e.preventDefault(); });
  cv.addEventListener("contextmenu", e => e.preventDefault());
  cv.addEventListener("wheel", e => { const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 600 : 1; send({ t: "wh", ...pos(e), dx: e.deltaX * k, dy: e.deltaY * k }); e.preventDefault(); }, { passive: false });
  const typing = () => !$("ask").hidden, skip = k => k === "Dead" || k === "Process" || k === "Unidentified";
  addEventListener("keydown", e => { if (typing() || st.view !== "app" || skip(e.key)) return; send({ t: "kd", k: e.key }); if (!(e.ctrlKey || e.metaKey) || e.key.length > 1) e.preventDefault(); });
  addEventListener("keyup", e => { if (typing() || st.view !== "app" || skip(e.key)) return; send({ t: "ku", k: e.key }); });
  addEventListener("paste", e => { if (typing() || st.view !== "app") return; const s = e.clipboardData && e.clipboardData.getData("text"); if (s) { send({ t: "tx", s }); e.preventDefault(); } });


  /* ---- the bar: the MinePad's own pill (slim white line at the bottom; hover or tap for Home / Back / Pin), wired to the shared home ---- */
  const svg = d => { const ns = "http://www.w3.org/2000/svg", e = document.createElementNS(ns, "svg"), q = document.createElementNS(ns, "path"); e.setAttribute("viewBox", "0 0 24 24"); e.setAttribute("width", "22"); e.setAttribute("height", "22"); e.setAttribute("fill", "#fff"); q.setAttribute("d", d); e.append(q); return e; };
  const wrap = $("wrap"), pill = $("pill"); wrap.style.cssText = "position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:2147483646;font:600 15px system-ui,sans-serif;color:#fff;";
  const SLIM = "height:7px;width:150px;border-radius:99px;background:#fffd;box-shadow:0 0 8px #000a;transition:all .2s;cursor:pointer;", OPEN = "height:auto;width:auto;border-radius:99px;background:#1c1c1ee6;backdrop-filter:blur(14px);box-shadow:0 4px 18px #000a;transition:all .2s;display:flex;gap:8px;padding:6px;cursor:default;";
  let isOpen = false, hideT; pill.style.cssText = SLIM;
  const toast = m => { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(t.h); t.h = setTimeout(() => { t.hidden = true; }, 2200); };
  const pinned = () => st.pins.some(x => x.u === meta.url);
  function btn(path, label, fn) {
    const b = document.createElement("div"), lb = document.createElement("span"); b.title = label; lb.style.marginLeft = "6px"; lb.textContent = label; b.append(svg(path), lb);
    b.style.cssText = "display:flex;align-items:center;padding:8px 14px;border-radius:99px;background:#ffffff22;white-space:nowrap;"; b.label = lb;
    b.onmouseenter = () => { b.style.background = "#ffffff55"; }; b.onmouseleave = () => { b.style.background = "#ffffff22"; };
    b.onclick = e => { e.stopPropagation(); fn(b); }; return b;
  }
  const bHome = btn("M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z", "Home", () => send({ t: "home" })),
    bBack = btn("M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z", "Back", () => send({ t: "back" })),
    bPin = btn("M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z", "Pin", () => { if (!meta.url || meta.url === "about:blank") return toast("Nothing to pin yet"); const was = pinned(); send({ t: was ? "unpin" : "pin", u: meta.url, title: (meta.title || "").slice(0, 24) }); toast(was ? "Removed from Home" : "Pinned to Home"); }),
    bGo = btn("M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z", "Search", () => { collapse(); $("ask").hidden = false; url.value = ""; url.focus(); }),
    bSnd = btn("M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z", "Sound", () => toggleSound());
  function paintPill() { bPin.label.textContent = pinned() ? "Unpin" : "Pin"; bSnd.label.textContent = on && AC && AC.state === "running" ? "Sound on" : "Sound off"; }
  function expand() { clearTimeout(hideT); if (isOpen) return; isOpen = true; paintPill(); pill.style.cssText = OPEN; const items = [bHome, bBack, bPin, bGo]; if (typeof AudioDecoder !== "undefined") items.push(bSnd); pill.replaceChildren(...items); }
  function collapse() { clearTimeout(hideT); isOpen = false; pill.replaceChildren(); pill.style.cssText = SLIM; }
  wrap.onmouseenter = expand; wrap.onclick = expand; wrap.onmouseleave = () => { hideT = setTimeout(collapse, 700); };
  const closeAsk = () => { $("ask").hidden = true; url.blur(); cv.focus(); };
  url.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") { const v = url.value.trim(); closeAsk(); if (v) send({ t: "nav", u: v }); } else if (e.key === "Escape") closeAsk(); });

  /* ---- sound: 20 ms Opus packets per audio source, decoded here and queued ~120 ms ahead ---- */
  window.__sbStats = { audio: 0 }; let AC = null, gain = null, on = true; const srcs = new Map();
  function sound() { if (AC) return AC; if (typeof AudioDecoder === "undefined") return null; AC = new AudioContext(); gain = AC.createGain(); gain.connect(AC.destination); paintPill(); return AC; }
  const paintSnd = () => paintPill();
  const toggleSound = () => { if (!sound()) return; if (AC.state !== "running") { AC.resume().then(paintSnd); on = true; } else on = !on; if (gain) gain.gain.value = on ? 1 : 0; paintSnd(); };
  for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => { if (AC && AC.state === "suspended" && on) AC.resume().then(paintSnd); }, true);
  function audioIn(u8) {
    if (!sound()) return; const id = new DataView(u8.buffer, u8.byteOffset + 1, 4).getUint32(0); let d = srcs.get(id);
    if (!d) { d = { t: 0 }; d.dec = new AudioDecoder({ output: ad => play(d, ad), error: () => srcs.delete(id) }); d.dec.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 2 }); srcs.set(id, d); }
    d.seen = Date.now(); try { d.dec.decode(new EncodedAudioChunk({ type: "key", timestamp: Math.round(performance.now() * 1000), data: u8.subarray(5) })); } catch {}
  }
  function play(d, ad) {
    const n = ad.numberOfFrames, ch = ad.numberOfChannels, buf = AC.createBuffer(ch, n, ad.sampleRate);
    for (let c = 0; c < ch; c++) { const f = new Float32Array(n); ad.copyTo(f, { planeIndex: c, format: "f32-planar" }); buf.copyToChannel(f, c); } ad.close();
    window.__sbStats.audio++; const s = AC.createBufferSource(); s.buffer = buf; s.connect(gain); const now = AC.currentTime; if (d.t < now + 0.02 || d.t > now + 0.7) d.t = now + 0.12; s.start(d.t); d.t += buf.duration;
  }
  setInterval(() => { for (const [id, d] of srcs) if (Date.now() - d.seen > 10000) { try { d.dec.close(); } catch {} srcs.delete(id); } }, 5000);

  tiles(); connect();
})();
</script></body></html>
