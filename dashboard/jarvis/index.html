<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080A">
<meta name="robots" content="noindex">
<title>Jarvis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jarvis.css?v=19">
<link rel="stylesheet" href="theme.css?v=1">
</head>
<body data-mode="idle">

<section id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card">
    <h1>Jarvis</h1>
    <p id="gateNote" class="gate-note" role="status">Authenticating</p>
    <div id="loginFields" hidden>
      <label>Homebase username<input id="user" autocomplete="username"></label>
      <label>Password<input id="pass" type="password" autocomplete="current-password"></label>
    </div>
    <div id="pinFields" hidden>
      <label>Jarvis PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12"></label>
    </div>
    <button id="gateGo" type="submit">Continue</button>
  </form>
</section>

<div id="ambient" class="ambient" aria-hidden="true"></div>
<div id="sweep" class="sweep" aria-hidden="true"></div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="brain" class="brain" hidden></div>

<div id="app" class="app" hidden>
  <header class="head">
    <div class="brand">
      <small>Home server</small>
      <h1>Jarvis</h1>
      <small>Personal assistant</small>
    </div>
    <div class="mini" id="mini" aria-hidden="true"></div>
    <div class="clock"><b id="clock">--:--</b><small id="date"></small></div>
  </header>

  <main class="hud">
    <div class="col left">
      <div class="side-head">
        <span class="side-mark" aria-hidden="true">J</span>
        <div><b>Jarvis</b><small id="brainCount">Loading the brain…</small></div>
      </div>
      <div id="brainSide" class="brain-side"></div>
      <h2 class="side-label">Today</h2>
      <button class="panel card" id="cardWeather" data-ask="what's the weather" hidden><h2>WEATHER<em id="wxPlace"></em></h2>
        <div class="wxnow"><b id="wxTemp"></b><div><span id="wxSky"></span><small id="wxMore"></small></div></div></button>
      <button class="panel card" id="cardCalendar" data-ask="what's on my calendar" hidden><h2>COMING UP</h2><ul class="list" id="calList"></ul></button>
      <button class="panel card" id="cardHome" data-ask="what's downloading" hidden><h2>DOWNLOADS</h2><ul class="list" id="homeList"></ul></button>
      <button class="panel card" id="cardDrive" data-ask="how much space have I got" hidden><h2>MEDIA DRIVE</h2>
        <div class="drive"><b id="driveFree"></b><small id="driveOf"></small></div><div class="drivebar"><i id="driveBar"></i></div><small class="drivenote" id="driveNote"></small></button>
      <button class="panel card" id="cardSport" data-ask="how did my team get on" hidden><h2>YOUR TEAMS</h2><ul class="list" id="sportList"></ul></button>
      <button class="panel card" id="cardF1" data-ask="when's the next f1 session" hidden><h2>FORMULA 1</h2><ul class="list" id="f1List"></ul></button>
      <button class="panel card" id="cardMinecraft" data-ask="is anyone on minecraft" hidden><h2>MINECRAFT</h2><ul class="list" id="mcList"></ul></button>
      <button class="panel card" id="cardNews" data-ask="what's the news" hidden><h2>HEADLINES<em>BBC</em></h2><ul class="list" id="newsList"></ul></button>
    </div>

    <div class="core">
      <div class="reactor" aria-hidden="true">
        <svg viewBox="0 0 400 400">
          <g class="brackets"><path d="M60 40H22V22M340 40h38V22M60 360H22v18M340 360h38v18" transform="translate(0 0)"/></g>
          <g class="ticks" id="ticks"></g>
          <circle class="r r0" cx="200" cy="200" r="168"/>
          <g class="spin s1"><circle class="arc a1" cx="200" cy="200" r="156" pathLength="360" stroke-dasharray="70 40 26 224"/></g>
          <g class="spin s2"><circle class="arc a2" cx="200" cy="200" r="134" pathLength="360" stroke-dasharray="24 60 90 186"/></g>
          <g class="spin s3"><circle class="arc a3" cx="200" cy="200" r="116" pathLength="360" stroke-dasharray="110 30 20 200"/></g>
          <circle class="r r1" cx="200" cy="200" r="104"/>
          <circle class="face" cx="200" cy="200" r="100"/>
          <circle class="level" cx="200" cy="200" r="104"/>
        </svg>
        <div class="reactor-read">
          <small>JARVIS</small>
          <b class="state" id="modeLabel">READY</b>
          <div class="vu"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <small class="hintline" id="hintLine">SAY "HEY JARVIS" OR TAP THE MIC</small>
        </div>
      </div>
      <button class="serverstrip" id="serverStrip" type="button" title="Server details"><i id="linkDot"></i><span id="stripText">SERVER / CONNECTING</span></button>
      <div class="nowbar" id="nowbar" hidden></div>
      <div class="wakestate" id="wakeState" hidden></div>
      <p class="said" id="said" role="status" aria-live="polite"></p>
      <div class="voicewarn" id="voiceWarn" hidden></div>
      <section class="stage" id="stage" hidden aria-live="polite"></section>
    </div>

    <div class="col right">
      <div id="brainFilter" class="brain-filter"></div>
    </div>
  </main>

  <nav class="dock" aria-label="Jarvis controls">
    <button id="wakeToggle" aria-pressed="false"><span><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></span><b>LISTEN</b><small id="wakeLabel">Off</small></button>
    <button id="voiceToggle" aria-pressed="true"><span><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"/></svg></span><b>VOICE</b><small id="voiceState">On</small></button>
    <button data-sheet="history"><span><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 103-6.7M3 4v4h4M12 7v5l3 2"/></svg></span><b>HISTORY</b><small>Earlier answers</small></button>
    <button data-sheet="log"><span><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg></span><b>ACTIVITY</b><small>Every action</small></button>
    <button data-sheet="settings"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span><b>SETTINGS</b><small>Voice, teams, quiet hours</small></button>
    <button id="signOut"><span><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span><b>LOCK</b><small>Ask for the PIN</small></button>
  </nav>

  <form class="command" id="commandForm">
    <button type="button" id="mic" class="mic" aria-label="Speak a command" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <button type="button" id="modelPick" class="modelpick" data-model="haiku" aria-label="Claude model for your requests: Haiku. Tap to change">HAIKU</button>
    <input id="command" autocomplete="off" maxlength="500" placeholder="Ask Jarvis anything" aria-label="Command">
    <button type="button" id="stopAll" class="stopall" aria-label="Stop everything" title="Stop everything"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <button type="submit">SEND</button>
  </form>
</div>

<aside id="sheet" class="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Close">×</button></header>
  <div id="sheetBody"></div>
</aside>
<script src="speech-end.js?v=2"></script>
<script src="jarvis.js?v=37"></script>
<script src="brain.js?v=5"></script>
</body>
</html>
