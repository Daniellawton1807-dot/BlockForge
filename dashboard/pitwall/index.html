<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitwall">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pitwall — Homebase</title>
<link rel="stylesheet" href="../style.css?v=homebase-rp-1">
<link rel="stylesheet" href="../hub.css?v=homebase-push-1">
<link rel="stylesheet" href="../cinema.css?v=cinema-3">
<style>body { min-height:100dvh; display:grid; place-items:center; padding:20px; } .pw-wrap { width:min(520px,100%); } #hubContent p { text-align:center; }</style>
</head>
<body>
<div class="pw-wrap">
  <section id="hubGate" class="download-login-panel media-access-panel hub-gate" hidden aria-labelledby="hubGateTitle">
    <div><div class="kicker">PITWALL · F1 MULTIVIEW</div><h2 id="hubGateTitle">Sign in to watch</h2><p id="hubGateMessage" class="download-auth-message" aria-live="polite">Checking this device's sign-in…</p></div>
    <form id="hubLoginForm" class="download-login" autocomplete="on">
      <label>Username<input id="hubUsername" name="username" type="text" autocomplete="username" maxlength="512" required></label>
      <label>Password<input id="hubPassword" name="password" type="password" autocomplete="current-password" maxlength="512" required></label>
      <label class="remember-row"><input id="hubRemember" type="checkbox" checked><span>Remember me on this device<small>The same Homebase sign-in as the Media hub.</small></span></label>
      <button class="download-login-button" type="submit">Sign in</button>
    </form>
  </section>
  <div id="hubContent" hidden><p>Opening Pitwall…</p></div>
</div>
<script src="../hub.js?v=homebase-push-1"></script>
<script>
// Pitwall itself is served from /api/pitwall/ (the Homebase cookie only travels to /api); this page signs in and hands over.
Hub.gate({ message: "Sign in to open Pitwall.", onReady: () => location.replace("/api/pitwall/" + location.search) });
</script>
</body>
</html>
