name = "homebase-arr-bridge"
main = "src/index.js"
compatibility_date = "2026-10-20"
workers_dev = false
preview_urls = false

# Autopilot: wake Homebase every 15 minutes to fix stuck downloads (secret AUTOPILOT_TOKEN)
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "AUTOPILOT"
id = "87e36a93f0f54b989fae4fcd682bcd88"

[[vpc_services]]
binding = "VPC_SONARR_DANIEL"
service_id = "01a15918-4999-7aa2-a1b3-0727f807e89a"

[[vpc_services]]
binding = "VPC_SONARR_MUM"
service_id = "01a15918-96de-7e92-ae01-803984f7056c"

[[vpc_services]]
binding = "VPC_SONARR_EXTRA"
service_id = "01a15918-e2d7-7d62-ab17-98cc8cadfbb7"

[[vpc_services]]
binding = "VPC_RADARR"
service_id = "01a15919-2937-76b2-a245-3f1dfc725909"

# tvbot (TV remote) on the server, port 8765 (Workers VPC service "homebase-tvbot").
[[vpc_services]]
binding = "VPC_TVBOT"
service_id = "01a1891d-e23e-7202-9f78-5112942ddb45"

# Jarvis on the server, port 8770 (Workers VPC service "homebase-jarvis"; secret JARVIS_TOKEN).
[[vpc_services]]
binding = "VPC_JARVIS"
service_id = "01a1a6c0-cf6a-7713-b01f-9039650edbef"

# Pitwall Web (F1 multi-viewer) on the server, port 8774 (Workers VPC service "homebase-pitwall"; secret PITWALL_TOKEN).
[[vpc_services]]
binding = "VPC_PITWALL"
service_id = "01a1c5d1-62d2-7802-8c2c-ee88b295d36f"
