name = "jarvis-alexa"
main = "src/index.js"
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# The public HTTPS address Daniel's private Alexa skill calls. Only requests Amazon signed for his skill get through.
# Secret: ALEXA_TOKEN (matches Jarvis's .env). ALEXA_SKILL_ID below is what it accepts.
[vars]
ALEXA_SKILL_ID = "amzn1.ask.skill.7ab35f6c-d845-4f18-b8ef-746e8a2135a6"

[[vpc_services]]
binding = "VPC_JARVIS"
service_id = "01a1a6c0-cf6a-7713-b01f-9039650edbef"
